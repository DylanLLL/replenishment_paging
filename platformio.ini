[env:floor_unit]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<multitier_floor>
lib_deps =
    knolleary/PubSubClient @ ^2.8

[env:ground_unit]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<ground_floor>
lib_deps =
    knolleary/PubSubClient @ ^2.8

[env:esp_get_mac_address]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<esp_get_mac_address.cpp>
lib_deps =
    knolleary/PubSubClient @ ^2.8

[env:esp_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<esp_test.cpp>
lib_deps =
    knolleary/PubSubClient @ ^2.8